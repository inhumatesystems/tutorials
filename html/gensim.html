<html>
    <head>
        <script src="https://get.inhumatelabs.com/js/rti.js"></script>
        <script src="https://get.inhumatelabs.com/js/gensim.js"></script>
    </head>
    <body>
        <h1>Gensim App</h1>
        <div id="entities">No entities received</div>
        <script>
            const rti = new RTI.Client({ application: "RTI App" })
            rti.on("connect", () => console.log("Connected to RTI", rti.url))
            rti.on("error", (error) => console.error("RTI error", error))

            let entities = {}

            rti.subscribe(Gensim.channel.entity, Gensim.proto.Entity, (entity) => {
                if (entity.deleted) {
                    console.log("Received entity deletion", entity.title || entity.id)
                    delete entities[entity.id]
                } else {
                    console.log("Received entity", entity.title || entity.id)
                    entities[entity.id] = entity
                }
                updateList()
            })

            rti.whenConnected(() => {
                rti.publish(Gensim.channel.entityOperation, Gensim.proto.EntityOperation, {
                    requestUpdate: {}
                })
            })

            function updateList() {
                const entitiesDiv = document.getElementById("entities")
                if (Object.keys(entities).length === 0) {
                    entitiesDiv.innerText = "No entities known"
                } else {
                    entitiesDiv.innerHTML = Object.values(entities)
                        .map((entity) => `<div>${entity.title || entity.id}</div>`)
                        .join("")
                }
            }
        </script>
    </body>
</html>
